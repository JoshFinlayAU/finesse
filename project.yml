name: Finesse

options:
  bundleIdPrefix: invalid.placeholder
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Ad-hoc in the simulator: no team needed, and Keychain calls fail with -34018 when unsigned.
    "CODE_SIGN_IDENTITY[sdk=appletvsimulator*]": "-"
    "CODE_SIGN_STYLE[sdk=appletvsimulator*]": Manual

targets:
  Finesse:
    type: application
    platform: tvOS
    sources:
      - path: Finesse
    settings:
      base:
        PRODUCT_NAME: Finesse
        PRODUCT_MODULE_NAME: FinEsse
        PRODUCT_BUNDLE_IDENTIFIER: invalid.placeholder.finesse
        INFOPLIST_FILE: Finesse/Resources/Info.plist
        ENABLE_PREVIEWS: "YES"

  FinesseTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: FinesseTests
    dependencies:
      - target: Finesse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.placeholder.finesse.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Finesse.app/Finesse"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FinesseIntegrationTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: FinesseIntegrationTests
    dependencies:
      - target: Finesse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.placeholder.finesse.integrationtests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Finesse.app/Finesse"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FinesseUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: FinesseUITests
    dependencies:
      - target: Finesse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.placeholder.finesse.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Finesse

schemes:
  Finesse:
    build:
      targets:
        Finesse: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FinesseTests
        - FinesseIntegrationTests
        - FinesseUITests
      testPlans:
        - path: Finesse.xctestplan
          defaultPlan: true
        - path: Integration.xctestplan
        - path: UI.xctestplan
    archive:
      config: Release
