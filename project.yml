name: Finesse

options:
  bundleIdPrefix: au.com.athenanetworks
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "26.0"
  # The project is disposable, so the committed pins live at the repo root and are copied in.
  postGenCommand: >-
    if [ -f Package.resolved ]; then
    mkdir -p Finesse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm &&
    cp Package.resolved Finesse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved;
    fi

packages:
  JellyfinAPI:
    url: https://github.com/jellyfin/jellyfin-sdk-swift.git
    exactVersion: 3.4.0
  Get:
    url: https://github.com/kean/Get
    from: 2.2.1
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4S7BG5A4XV
    # Ad-hoc in the simulator: no team needed, and Keychain calls fail with -34018 when unsigned.
    "CODE_SIGN_IDENTITY[sdk=appletvsimulator*]": "-"
    "CODE_SIGN_STYLE[sdk=appletvsimulator*]": Manual

targets:
  Finesse:
    type: application
    platform: tvOS
    sources:
      - path: Finesse
    dependencies:
      - package: JellyfinAPI
        product: JellyfinAPI
      - package: Get
        product: Get
      - package: MPVKit
        product: MPVKit
      # Only a UIWindow category is used from AVKit, so autolinking would otherwise drop it.
      - sdk: AVKit.framework
    settings:
      base:
        PRODUCT_NAME: Finesse
        PRODUCT_MODULE_NAME: FinEsse
        PRODUCT_BUNDLE_IDENTIFIER: au.com.athenanetworks.finesse
        INFOPLIST_FILE: Finesse/Resources/Info.plist
        ENABLE_PREVIEWS: "YES"

  FinesseTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: FinesseTests
    dependencies:
      - target: Finesse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.athenanetworks.finesse.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Finesse.app/Finesse"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FinesseIntegrationTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: FinesseIntegrationTests
    dependencies:
      - target: Finesse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.athenanetworks.finesse.integrationtests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Finesse.app/Finesse"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FinesseUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: FinesseUITests
    dependencies:
      - target: Finesse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.athenanetworks.finesse.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Finesse

schemes:
  Finesse:
    build:
      targets:
        Finesse: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FinesseTests
        - FinesseIntegrationTests
        - FinesseUITests
      testPlans:
        - path: Finesse.xctestplan
          defaultPlan: true
        - path: Integration.xctestplan
        - path: UI.xctestplan
    archive:
      config: Release
